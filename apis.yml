aid: ten63-therapeutics
name: Ten63 Therapeutics
description: >-
  Ten63 Therapeutics is an AI-driven drug-discovery company spun out of Duke University in 2019 and
  operating from San Francisco, Durham and Boston. It builds BEYOND, which the company describes as
  the world's first Large Quantum Chemistry Model — pairing generative chemistry at scale (Move37)
  with a quantum-accurate forcefield and molecular-dynamics engine (Astrolabe) in an approach it
  calls Superlearning. BEYOND is used to design therapeutics for previously undruggable and
  under-drugged targets, with an internal pipeline focused on oncology and platform partnerships
  such as the multi-target collaboration with Boehringer Ingelheim. Ten63 is a therapeutics company,
  not a software vendor: it publishes no developer program, no public API, and no machine-readable
  API contract. It does publish an llms.txt describing the company and platform for AI agents.
